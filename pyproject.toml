[project]
name = "manipulator-kinematics"
version = "0.1.0"
description = "6-axis manipulator kinematics and trajectory visualization"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "pyserial>=3.5",
    "pyyaml>=6.0.3",
    "pybullet>=3.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[dependency-groups]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
]
