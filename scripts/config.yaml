# Configuration file for Trajectory Generation and Simulation

robot:
  name: "3Dprinted"  # Options: "3Dprinted", "UR3e"
  3Dprinted:
    home_config: [0.0, $pi/2, 0.0, 0.0, -$pi/2, 0.0]
  UR3e:
    home_config: [0.0, $pi/2, 0.0, 0.0, -$pi/2, 0.0]

trajectory:
  # General settings
  dt: 0.01    # Time step in seconds
  
  # Trajectory Interpolation Settings
  # Path is generated in Cartesian space (Straight line for position, SLERP for orientation)
  
  # IK Method: "differential" (recommended), "numerical"
  ik_method: "differential"
  
  # Velocity Profile Settings (Timing along the path)
  velocity_profile:
    type: "lspb"
    
    # Constraints for LSPB (Trapezoidal)
    velocity: 0.2  # m/s

targets:
  # List of waypoints/via-points for the trajectory
  # Each target defines position, orientation, and motion parameters
  - position: [0.187, 0.0, 0.0922]     # [x, y, z] in meters
    orientation: [0.0, $pi, $pi]    # [roll, pitch, yaw] in radians (ZYX Euler)
    mode: "exact_stop"              # "exact_stop" or "continuous"
    
  - position: [0.18, -0.1, 0.05]   # Second waypoint
    orientation: [0.0, $pi, $pi]
    mode: "exact_stop"
    
  - position: [0.187, 0.0, 0.235]   # Third waypoint
    orientation: [0.0, $pi, $pi]
    mode: "exact_stop"

visualization:
  animate: true
  plot_analysis: true
  frame_scale: 0.05
  animation_interval: 20 # ms
  speedup: 5 # Frame skipping factor (1=all frames, 5=every 5th frame)

real_robot:
  execute: true                 # Set to true to execute on real robot
  port: /dev/cu.usbserial-1420   # Set port or null for auto-select
